
server.port=3000


spring.application.name=ResumeMatcher
#Ollama configuration 
spring.ai.ollamallama.base-url =https://localhost:11434
spring.ai.ollama.chat.model=llama3


#Save logs to file 
logging.file.name=app.log
#adjust levle globally or per package
logging.level.root=INFO
logging.level.com.example.ResumeMatcher=DEBUG

# Static resources configuration (add these)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**


# Disable whitelabael completely 
server.error.whitelabel.enabled=false

#Show custom error messages
 server.eror.include-message=always
 server.eror.include-binding-errors=always
 server.eror.include-stacktrace=never

 #Throw exception for unknown URLs
 spring.mvc.throw-exception-if-no-handler-found=true
 spring.web.resources.add-mappings=true

 #Logging configuration 
 logging.level.com.example.AiResumeSummarizer=DEBUG
 logging.elevl.org.springframework.web=INFO
 logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} - %msg%n
logging.file.name=logs/resume-summarizer.log
logging.file.max-size=10MB
logging.file.max-history=30

# Monitoring endpoints (Actuator)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=resume-summarizer

# Info endpoint custom data
info.app.name=AI Resume Summarizer
info.app.version=1.0.0
info.app.description=Resume summarizer using Ollama AI
